apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def solanaSigning = [
    path: System.getenv('ZKUBE_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ZKUBE_ANDROID_KEYSTORE_PASSWORD'),
    alias: System.getenv('ZKUBE_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ZKUBE_ANDROID_KEY_PASSWORD'),
]
def storeSigning = [
    path: System.getenv('ZKUBE_ANDROID_STORE_KEYSTORE_PATH'),
    storePassword: System.getenv('ZKUBE_ANDROID_STORE_KEYSTORE_PASSWORD'),
    alias: System.getenv('ZKUBE_ANDROID_STORE_KEY_ALIAS'),
    keyPassword: System.getenv('ZKUBE_ANDROID_STORE_KEY_PASSWORD'),
]

def signingReady = { values -> values.values().every { value -> value != null && !value.isBlank() } }

android {
    namespace = "com.zkorp.zkube"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ZKUBE_ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ZKUBE_ANDROID_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady(solanaSigning)) {
            solanaRelease {
                storeFile file(solanaSigning.path)
                storePassword solanaSigning.storePassword
                keyAlias solanaSigning.alias
                keyPassword solanaSigning.keyPassword
            }
        }
        if (signingReady(storeSigning)) {
            storeRelease {
                storeFile file(storeSigning.path)
                storePassword storeSigning.storePassword
                keyAlias storeSigning.alias
                keyPassword storeSigning.keyPassword
            }
        }
    }
    flavorDimensions += "product"
    productFlavors {
        solana {
            dimension "product"
            applicationId "com.zkorp.zkube"
            if (signingReady(solanaSigning)) {
                signingConfig signingConfigs.solanaRelease
            }
        }
        store {
            dimension "product"
            applicationId "com.zkorp.zkube.store"
            if (signingReady(storeSigning)) {
                signingConfig signingConfigs.storeRelease
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    solanaImplementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.7'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
