app = "zkube-solana-devnet-paymaster"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "35s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SOLANA_DEVNET_RPC_URL = "https://rpc.magicblock.app/devnet"
  PAYMASTER_GENESIS_HASH = "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
  ZKUBE_PAYMASTER_PUBLIC_KEY = "CNhMPp5p3ViMEzBpeRRjXX1G672rwxHkyNG4gVRN7SgY"
  PAYMASTER_ALLOWED_ORIGINS = "https://zkube-solana.vercel.app,https://*.vercel.app"
  PAYMASTER_MAX_CONCURRENT_SUBMISSIONS = "8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[deploy]
  strategy = "rolling"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
