app = "zkube-solana-devnet-keeper"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "240s"

[build]
  dockerfile = "services/Dockerfile"

[processes]
  worker = "node dist/services/src/keeperWorker.js"

[env]
  NODE_ENV = "production"
  KEEPER_ENABLED = "true"
  # Production writes require exact write=true and release-fingerprint secret
  # overrides after the new image completes a read-only planning pass.
  KEEPER_WRITE_ENABLED = "false"
  KEEPER_INTERVAL_MS = "60000"

# No [http_service]: the keeper has no inbound surface.

[[restart]]
  policy = "always"
  processes = ["worker"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["worker"]
