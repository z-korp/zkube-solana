app = "zkube-solana-devnet-keeper"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "240s"

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "node services/dist/keeperWorker.js"

[env]
  NODE_ENV = "production"
  SOLANA_DEVNET_RPC_URL = "https://rpc.magicblock.app/devnet"
  SOLANA_EXPECTED_GENESIS_HASH = "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
  ZKUBE_KEEPER_PUBLIC_KEY = "6JuZiVic8yUipamYyzWvVUcTdD8kbpdpv79CBGjm4XTg"
  ZKUBE_REPLAY_DOMAIN_HEX = "0565f52607a6ee4b1efa50aa63e0060316e37e620cab63f1954315be4dfadd3c"
  ZKUBE_ARENA_RULES_CATALOG_SHA256 = "cfa5f8ff98a1d1b1996dc507c5f2879588acaf90cb9ce9f6cd8e26e4d6bcd440"
  ZKUBE_ARENA_RULES_VERSION = "1"
  ZKUBE_LAUNCH_DAY_ID = "20656"
  KEEPER_ENABLED = "true"
  # Production writes require exact write=true and release-fingerprint secret
  # overrides after the new image completes a read-only planning pass.
  KEEPER_WRITE_ENABLED = "false"
  KEEPER_INTERVAL_MS = "60000"
  KEEPER_MAX_WRITES = "8"
  KEEPER_MAX_SPEND_LAMPORTS_PER_PASS = "100000000"
  MIN_KEEPER_LAMPORTS = "100000000"
  ZKUBE_ARCHIVE_DIRECTORY = "/data/zkube-archives"
  # Prize notifications. Push stays entirely off unless all four are present;
  # the private key is a Fly secret and is never written here.
  ZKUBE_PUSH_PORT = "8080"
  ZKUBE_PUSH_VAPID_SUBJECT = "mailto:ops@z-korp.xyz"
  ZKUBE_PUSH_ALLOWED_ORIGINS = "https://zkube.z-korp.xyz"

# The keeper's only inbound surface: prize-notification registration. It
# cannot sign, cannot read chain, and cannot reach the keeper's signer — the
# worst a caller can do is add a row to a bounded JSON file.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["worker"]

[[mounts]]
  source = "zkube_archives"
  destination = "/data/zkube-archives"

[[restart]]
  policy = "always"
  processes = ["worker"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["worker"]
