[workspace]
members = [
    "programs/*",
    "crates/zkube-core",
    "crates/zkube-core-wasm",
    "crates/zkube-codegen",
]
resolver = "2"

[profile.release]
opt-level = "s"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
