[package]
name = "solana"
version = "0.1.0"
description = "zKube game program for Solana and MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
sbf-tests = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.15.5", features = ["anchor", "vrf"] }
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
mollusk-svm = "=0.7.0"
serde_json = "1"
solana-account = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
