name: Static validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: NO_DNA=1 cargo fmt --all -- --check
      - name: Rust tests
        run: NO_DNA=1 cargo test --workspace
      - name: Rust clippy
        run: NO_DNA=1 cargo clippy --workspace --all-targets -- -D warnings

  keeper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.22.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml
      - run: NO_DNA=1 pnpm install --frozen-lockfile --prefer-offline
      - run: NO_DNA=1 pnpm run build
      - run: NO_DNA=1 pnpm test

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.22.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install locked dependencies
        run: NO_DNA=1 pnpm install --frozen-lockfile
      - name: TypeScript
        run: NO_DNA=1 pnpm exec tsc -b --pretty false
      - name: Chain TypeScript
        run: NO_DNA=1 pnpm run typecheck:chain
      - name: Lint
        run: NO_DNA=1 pnpm lint
      - name: Tests
        run: NO_DNA=1 pnpm exec vitest run
      - name: Production build
        run: NO_DNA=1 pnpm build
