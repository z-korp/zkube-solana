name: Static validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/sbpf-solana-solana
          key: rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Formatting
        run: NO_DNA=1 cargo fmt --all -- --check
      - name: Host tests
        run: NO_DNA=1 cargo test --workspace
      - name: Clippy
        run: NO_DNA=1 cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache pinned SBF build tools
        id: cache-sbf-tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/bin/avm
            ~/.cargo/bin/cargo-build-sbf
            ~/.avm
            ~/.cache/solana/v1.52
          key: build-tools-${{ runner.os }}-${{ runner.arch }}-anchor-1.0.2-cargo-build-sbf-4.0.0-platform-tools-v1.52
      - name: Install pinned Anchor CLI
        if: steps.cache-sbf-tools.outputs.cache-hit != 'true'
        run: |
          NO_DNA=1 cargo install --git https://github.com/solana-foundation/anchor --rev 1314a6b83b16e6a31947b372d57988fd0e81559c avm --locked
          NO_DNA=1 avm install 1.0.2
          NO_DNA=1 cargo install cargo-build-sbf --version 4.0.0 --locked
      - name: Activate pinned build tools
        run: |
          NO_DNA=1 avm use 1.0.2
          test "$(NO_DNA=1 anchor --version)" = "anchor-cli 1.0.2"
          test "$(NO_DNA=1 cargo build-sbf --version | sed -n '1p')" = "cargo-build-sbf 4.0.0"
      - name: SBF build, IDL generation, and diagnostic scan
        run: NO_DNA=1 ./validate.sh program-sbf
      - name: Upload client ABI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anchor-client-abi
          path: |
            target/idl/solana.json
            target/types/solana.ts
          if-no-files-found: error
          retention-days: 1

  frontend:
    needs: rust-host
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.22.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Download generated client ABI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anchor-client-abi
          path: target
      - name: Install locked dependencies
        run: NO_DNA=1 pnpm install --frozen-lockfile
      - name: IDL drift
        run: NO_DNA=1 pnpm idl:check
      - name: TypeScript
        run: NO_DNA=1 pnpm exec tsc -b --pretty false
      - name: Chain TypeScript
        run: NO_DNA=1 pnpm run typecheck:chain
      - name: Lint
        run: NO_DNA=1 pnpm lint
      - name: Tests
        run: NO_DNA=1 pnpm exec vitest run
      - name: Production build
        run: NO_DNA=1 pnpm build
