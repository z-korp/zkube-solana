name: Mobile iOS beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      NO_DNA: "1"
      BUNDLE_GEMFILE: ${{ github.workspace }}/client/Gemfile
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_CERTIFICATE_PATH: ${{ runner.temp }}/zkube-distribution.p12
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/zkube.mobileprovision
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.22.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install locked web dependencies
        run: NO_DNA=1 pnpm install --frozen-lockfile
      - name: Build web assets
        run: NO_DNA=1 pnpm build
      - name: Sync iOS shell
        run: NO_DNA=1 pnpm cap:sync:ios
      - name: Materialize ephemeral signing inputs
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$IOS_CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$IOS_PROVISIONING_PROFILE_PATH"
      - name: Build and upload TestFlight beta
        run: NO_DNA=1 bundle exec fastlane ios beta
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zkube-ios-beta
          path: client/build/mobile/ios/zkube.ipa
          if-no-files-found: error
