[package]
name = "zkube-core"
version = "0.1.0"
description = "Deterministic, chain-neutral zKube protocol primitives"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
