[package]
name = "zkube-core"
version = "1.0.0"
description = "Deterministic, chain-neutral zKube protocol primitives"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[features]
default = []
sim-harness = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "zkube-sim"
path = "src/bin/zkube-sim.rs"
required-features = ["sim-harness"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
