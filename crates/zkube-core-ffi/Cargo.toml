[package]
name = "zkube-core-ffi"
version = "0.1.0"
description = "Native Unity boundary over the shared zKube engine"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zkube-core-wasm = { path = "../zkube-core-wasm" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
